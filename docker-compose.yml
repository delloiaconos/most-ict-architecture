#most-ict-architecture/docker-compose.yml
version: '3.8'

networks:
  most-neeet:
    ipam:
      config:
      - subnet: 192.168.120.0/24

  wg-net:
    ipam:
      config:
      - subnet: 192.168.123.0/24

  most_net:
    external: true

services:

  nginx:
    image: nginx:1.29.3-alpine3.22
    hostname: nginx
    networks:
      - most_net
    restart: always
    ports:
    - 80:80
    volumes:
    - /opt/most/nginx/nginx.conf:/etc/nginx/nginx.conf

  nodered:
    image: nodered/node-red:4.1.1-22
    hostname: nodered
    networks:
      - most_net
    restart: always
    ports:
    - 1880:1880
    volumes:
    -  /opt/most/nodered:/data
