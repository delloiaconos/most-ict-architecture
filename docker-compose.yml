#most-ict-architecture/docker-compose.yml
version: '3.8'

networks:
  most-neeet:
    ipam:
      config:
      - subnet: 192.168.120.0/24

  wg-net:
    ipam:
      config:
      - subnet: 192.168.123.0/24

  most_net:
    external: true

services:

  nginx:
    image: nginx:1.29.3-alpine3.22
    hostname: nginx
    networks:
      - most_net
    restart: always
    ports:
    - 80:80
    volumes:
    - /opt/most/nginx/nginx.conf:/etc/nginx/nginx.conf
    - /etc/localtime:/etc/localtime:ro
  
  nodered:
    image: nodered/node-red:4.1.1-22
    hostname: nodered
    networks:
      - most_net
    restart: always
    ports:
    - 1880:1880
    volumes:
    - /opt/most/nodered:/data
    - /etc/localtime:/etc/localtime:ro

  influx:
    image: influxdb:1.11.7
    hostname: influx
    networks:
      - most_net
    restart: always
    user: "1000:1000"
    ports:
    - 8086:8086
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: giroe
      DOCKER_INFLUXDB_INIT_PASSWORD: giroe2025
      DOCKER_INFLUXDB_INIT_BUCKET: TourE
    volumes:
    - /etc/localtime:/etc/localtime:ro
    - /opt/most/influx/data:/var/lib/influxdb
    - /opt/most/influx/influxdb.conf:/etc/influxdb/influxdb.conf:rw
