
user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /run/nginx.pid;


events {
    worker_connections  1024;
}

http {
    server {
        listen 80;
        server_name giroe.elux.ing.unibs.it www.giroe.elux.ing.unibs.it;
        
	location =/ {
	        return 302 /dashboard/;
        }

        
#        location ~ ^/editor {
#	        return 302 http://giroe.elux.ing.unibs.it:1880/editor;
#        }

        location / {
            #Point to dashboard
            #proxy_pass http://giroe.elux.ing.unibs.it:1880/dashboards/$uri$is_args$args;
            proxy_pass http://giroe.elux.ing.unibs.it:1880/;
            #rewrite ^/(.*)$ /dashboards/$1 break;
        }

        
    }

}
